<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Placement AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-brand">
        <div class="brand-icon">🎓</div>
        <h1>Create Account</h1>
        <p>Join the Smart Placement System</p>
      </div>

      {% if error %}
        <div class="alert alert-error">⚠️ {{ error }}</div>
      {% endif %}

      <form method="POST" action="/register" class="auth-form">
        <div class="input-group">
          <span class="input-icon">👤</span>
          <input type="text" name="username" placeholder="Choose a username (min 3 chars)" required minlength="3" autofocus>
        </div>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" name="password" id="pw1" placeholder="Create password (min 6 chars)" required minlength="6">
          <button type="button" class="pw-toggle" onclick="togglePwd('pw1', this)">👁</button>
        </div>
        <div class="input-group">
          <span class="input-icon">✅</span>
          <input type="password" name="confirm" id="pw2" placeholder="Confirm password" required>
          <button type="button" class="pw-toggle" onclick="togglePwd('pw2', this)">👁</button>
        </div>

        <!-- Password strength indicator -->
        <div class="pw-strength">
          <div class="pw-bar" id="pwBar"></div>
        </div>
        <div class="pw-label" id="pwLabel"></div>

        <button type="submit" class="btn-auth">Create Account →</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Login here</a>
      </div>
    </div>
  </div>

  <script>
    function togglePwd(id, btn) {
      const f = document.getElementById(id);
      f.type = f.type === "password" ? "text" : "password";
      btn.textContent = f.type === "password" ? "👁" : "🙈";
    }

    // Password strength indicator
    document.getElementById("pw1").addEventListener("input", function() {
      const v = this.value;
      const bar = document.getElementById("pwBar");
      const lbl = document.getElementById("pwLabel");
      let strength = 0;
      if (v.length >= 6) strength++;
      if (v.length >= 10) strength++;
      if (/[A-Z]/.test(v)) strength++;
      if (/[0-9]/.test(v)) strength++;
      if (/[^A-Za-z0-9]/.test(v)) strength++;

      const colors = ["","#e24b4a","#f59e0b","#f59e0b","#1d9e75","#1d9e75"];
      const labels = ["","Weak","Fair","Good","Strong","Very Strong"];
      bar.style.width = (strength * 20) + "%";
      bar.style.background = colors[strength] || "#e2e8f0";
      lbl.textContent = labels[strength] || "";
      lbl.style.color = colors[strength] || "#64748b";
    });
  </script>
</body>
</html>
